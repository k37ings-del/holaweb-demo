name: Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ftp.holaweb.co.za
          username: ${{ secrets.holawebc }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: dist/
          server-dir: /httpdocs/
